# golangci-lint v2 configuration. Run `task lint:go` or `golangci-lint run ./...`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        # CONTRIBUTING.md: feature packages import internal/platform and their
        # own ports, never an adapter. Only the composition root (internal/app)
        # and the adapters themselves may import internal/adapters/...; tests
        # may still use adapters and their fakes.
        no-adapters-in-features:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
            - "!**/internal/adapters/**"
            - "!$test"
          deny:
            - pkg: github.com/Reidevl/rn-lens/internal/adapters/
              desc: feature packages must not import adapters; wire them in internal/app or behind a port
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, unnamedResult, rangeValCopy]
    gosec:
      excludes:
        - G204 # subprocess launched with variable: we launch user-selected tools on purpose
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Reidevl/rn-lens

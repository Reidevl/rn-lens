name: Feature request
description: Propose a capability for Lens.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Lens does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Console,
          Network,
          Queries,
          Mutations,
          Storage,
          Performance,
          Targets,
          SDK,
          Plugins,
          Docs,
          Other,
        ]

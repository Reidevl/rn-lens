name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.1.0"

jobs:
  # Child PRs (feat/<milestone>-NN-<slice>) run on Ubuntu only; tracker PRs,
  # PRs into main and pushes to main run the full three-OS matrix. macOS
  # minutes cost ten times Linux minutes on private repositories.
  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          full='["ubuntu-latest","macos-latest","windows-latest"]'
          light='["ubuntu-latest"]'
          os="$full"
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" != "main" ] && printf '%s' "$HEAD" | grep -Eq '^feat/m[0-9]+-[a-z0-9-]+-[0-9]{2}-'; then
            os="$light"
          fi
          echo "head=$HEAD base=$BASE ref=$REF -> $os"
          echo "os=$os" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          go install gotest.tools/gotestsum@v1.13.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Wails bindings
        run: task common:generate:bindings

      - name: Verify go.mod and go.sum are tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          skip-cache: true # setup-go already restores the module cache

      - name: Lint frontend
        run: task lint:frontend

      - name: Typecheck
        run: task typecheck

      - name: Test
        run: task test

      - name: Build frontend
        run: task common:build:frontend

      - name: Build binary
        run: go build ./...

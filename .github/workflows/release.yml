name: Release

# Builds and publishes a release that release-please created: the rnlens
# archives (GoReleaser), their checksums signature, SBOMs and build
# provenance, the npm packages (the rnlens launcher and the @rnlens/sdk
# library), Homebrew and Scoop manifests, and the desktop app for each OS. release-please.yml calls it after creating the release;
# it can also be re-run by hand for an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  WAILS_VERSION: "v3.1.0"
  TAG: ${{ inputs.tag }}

jobs:
  rnlens:
    name: rnlens archives
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # keyless cosign signature and provenance
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # The Wails CLI links the Linux webview, even when it only builds the
      # frontend and bindings.
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - name: Build and upload archives, checksums, Homebrew and Scoop
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Sign the checksums and write SBOMs
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
          for archive in dist/rnlens_*.tar.gz dist/rnlens_*.zip; do
            syft scan "file:$archive" -o "spdx-json=$archive.sbom.json"
          done

      - name: Upload signature and SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/checksums.txt.sig dist/checksums.txt.pem dist/*.sbom.json --clobber

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/rnlens_*.tar.gz
            dist/rnlens_*.zip

      - name: Keep the binaries for the npm job
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: |
            dist/artifacts.json
            dist/rnlens_*/rnlens*
          retention-days: 1

  npm:
    name: npm packages
    needs: rnlens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: goreleaser-dist
          path: dist

      - name: Build the packages
        run: node packages/rnlens/scripts/build-npm.js --root . --out dist/npm --version "$TAG"

      # npm 11.15+ has `npm stage publish`; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install -g npm@11

      # Versions are staged, not live: a maintainer approves each one on
      # npmjs.com (Staged Packages) or with `npm stage approve`, with 2FA.
      # Trusted publishing (OIDC) authenticates; there is no npm token.
      # A version already published is skipped, so a re-run after a partial
      # failure stages only what is missing. npm refuses to stage a version
      # that is already staged: approve or reject those before re-running.
      - name: Stage the platform packages, then the launcher
        run: |
          tag=latest
          case "$TAG" in *-*) tag=next ;; esac
          for dir in dist/npm/cli-* dist/npm/rnlens; do
            spec=$(node -p 'const p = require(process.argv[1]); p.name + "@" + p.version' "$PWD/$dir/package.json")
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already published, skipping"
              continue
            fi
            npm stage publish "$dir" --access public --provenance --tag "$tag"
          done

  sdk:
    name: SDK package
    needs: rnlens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the SDK version matches the tag
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::packages/sdk/package.json has version $version, but the tag is $TAG"
            exit 1
          fi

      - name: Test and build
        run: |
          pnpm --filter @rnlens/sdk test
          pnpm --filter @rnlens/sdk build

      # pnpm pack replaces workspace: ranges with real versions; npm publish
      # on the folder would copy them into the published package.json as-is.
      - name: Pack
        run: pnpm --filter @rnlens/sdk pack --pack-destination "$RUNNER_TEMP/sdk"

      # npm 11.15+ has `npm stage publish`; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install -g npm@11

      # Staged, not live: a maintainer approves it with 2FA.
      # Trusted publishing (OIDC); skipped when this version is already
      # published, as in the npm job.
      - name: Stage
        run: |
          tag=latest
          case "$TAG" in *-*) tag=next ;; esac
          spec=$(node -p 'const p = require("./packages/sdk/package.json"); p.name + "@" + p.version')
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already published, skipping"
            exit 0
          fi
          npm stage publish "$RUNNER_TEMP"/sdk/*.tgz --access public --provenance --tag "$tag"

  desktop:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          # choco does not put makensis on the PATH of later steps.
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # One app for Apple silicon and Intel Macs.
          task darwin:package:universal
          mkdir -p out
          ditto bin/rnlens.app out/Lens.app
          ditto -c -k --keepParent out/Lens.app "out/Lens_${TAG}_macos_universal.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          task windows:package
          mkdir -p out
          # build/windows/nsis/project.nsi writes bin/<name>-<arch>-installer.exe.
          installer=$(find bin -maxdepth 1 -name '*-installer.exe' | head -1)
          test -n "$installer" || { echo "no installer in bin/" >&2; exit 1; }
          cp "$installer" "out/Lens_${TAG}_windows_amd64_setup.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          task linux:create:appimage
          mkdir -p out
          appimage=$(find bin -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$appimage" || { echo "no AppImage in bin/" >&2; exit 1; }
          cp "$appimage" "out/Lens_${TAG}_linux_x86_64.AppImage"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" out/Lens_* --clobber
